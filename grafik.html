<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clean Water Production Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }
    h2 {
      text-align: center;
      color: #007bff;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h2>National Clean Water Production (2014–2023)</h2>
  <canvas id="waterChart"></canvas>

  <script>
    const ctx = document.getElementById('waterChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['2014','2015','2017','2018','2019','2020','2021','2022','2023'],
        datasets: [{
          label: 'Production (million m³)',
          data: [4300, 4550, 4700, 4884.9, 5000, 5100, 5250, 5270, 5501],
          borderColor: 'rgba(0, 123, 255, 1)',
          backgroundColor: 'rgba(0, 123, 255, 0.2)',
          fill: true,
          tension: 0.4,
          pointRadius: 5,
          pointBackgroundColor: '#007bff'
        }]
      },
      options: {
        responsive: true,
        animation: {
          duration: 2000,
          easing: 'easeOutBounce'
        },
        plugins: {
          title: {
            display: true,
            text: 'Clean Water Production Statistics (2014–2023)',
            font: {
              size: 18
            }
          },
          tooltip: {
            mode: 'index',
            intersect: false
          },
          legend: {
            display: true,
            labels: {
              color: '#333'
            }
          }
        },
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        scales: {
          y: {
            beginAtZero: false,
            title: {
              display: true,
              text: 'Volume (million m³)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Year'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
